# Template for tool path configuration. This is the default; new_project
# copies it to config/tools.yml on first run, or install.sh generates that
# copy. Edit the machine copy, not this template.
#
# Path options:
#   null              - use the managed install in bin/  (download by install.sh)
#   "/path/to/tool"   - absolute local path
#   "tool"            - bare name; looked up in PATH at runtime
#   "user@host:/path" - remote SSH path; the pipeline wraps the call with ssh
#
# Note: the generated config/tools.yml is gitignored (machine-specific);
#       only this template under config/defaults/ is committed.

cutadapt:
  path: null

fastqc:
  path: null

multiqc:
  path: null

vsearch:
  path: null
  # Remote example (vsearch on a compute server):
  # path: "user@bioserver:/home/user/software/vsearch"

cd_hit_est:
  path: null
