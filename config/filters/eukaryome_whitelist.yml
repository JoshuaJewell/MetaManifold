# Whitelist of target eukaryote genera treated as legitimate (never contamination).
# Matches a row whose Genus is exactly one of these; edit the list to curate the
# study's organisms of interest. Genus is source-translated (Genus_dada2 under
# DADA2 tagging) automatically.
databases: [pr2]

filters:
  - column: Genus
    type: include
    values:
      - Hexamastix
      - Simplicimonas
      - Iotanema
      - Blastocystis
      - Colpodella
      - Spironucleus
