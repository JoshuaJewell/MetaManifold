# Invertebrates filter - retains non-vertebrate, non-helminth Metazoa.
# Keeps: Annelida, Arthropoda, Rotifera, Platyhelminthes (free-living),
#        Miculenchus (moss-associated nematode), and other non-Craniata Metazoa.
# Excludes Craniata (vertebrates/host) and parasitic nematodes (helminths filter).
databases: [pr2]

filters:
  - column: Subdivision
    pattern: Metazoa
    action: keep
  - column: Class
    pattern: Craniata
  - column: Class
    pattern: Nematoda

remove_empty:
  - Subdivision
